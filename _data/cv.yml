- title: Industry Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: Samsung Research America
      year: Jun 2026 – Sep 2026
      location: Mountain View, CA
      description:
        - "Proposed LI-RAG (under review at ICLR 2027) to answer complex multi-hop questions accurately at low inference cost. Strong multi-hop systems call an LLM at every retrieval step, which is slow; LI-RAG instead fine-tunes an embedding model (NV-Embed-v2 with LoRA) to imitate how an LLM breaks a question into sub-questions, so it retrieves evidence hop by hop with no LLM calls."
        - "Outperformed all retrievers of comparable cost on 4 multi-hop QA benchmarks, beating the graph-based HippoRAG 2 by up to 8.6 accuracy points, and matched the LLM-driven IRCoT on most benchmarks while retrieving ~9× faster, using only 4K training questions and no human-labeled evidence."
        - "Built a trainable graph retriever that re-weights the knowledge graph per query, rather than searching one fixed graph for all queries, as HippoRAG 2 does; implemented differentiable Personalized PageRank to train the edge scorer end to end."
    - title: Natural Language Processing Intern
      institution: Five9
      year: Jun 2025 – Aug 2025
      location: San Ramon, CA
      description:
        - "Developed two multi-agent architectures: a finite state machine flow and a stack-based coordination system, with hierarchical state management, sub-agent invocation, and dynamic tool generation, enabling seamless orchestration and context consistency across multi-turn dialogues."
        - "Developed a ReAct (Reasoning + Acting) framework for both single- and multi-agent systems, integrating structured planning, reasoning, and action cycles, dynamic tool selection, and multi-step problem decomposition with iterative reasoning loops."
        - "Integrated RAG-based knowledge retrieval and API simulation, including context-aware search, dynamic function creation, and knowledge group management, grounding agent reasoning in external data for reliable performance."
        - "Built an automated customer simulator with dynamic persona generation and adaptive system prompts, producing realistic user behaviors and responses for robust testing of agent performance."
        - "Developed a modular evaluation platform supporting both real-time and post-conversation analysis, with extensible metrics (response quality, latency, tool usage correctness, etc.) and automated report generation for comprehensive system assessment."
    - title: Machine Learning Engineer Intern
      institution: Xiaomi Technology Corporation
      department: AI Lab
      year: May 2022 – Aug 2022
      location: Beijing, China
      description:
        - "Initiated a groundbreaking project, utilizing multi-channel microphone arrays to successfully achieve multi-directional speech extraction in in-car call scenarios."
        - "Developed an automated in-vehicle scene data simulation framework, resolved data scarcity issue. This provided one-click data generation, incorporating varied acoustic parameters and creating a comprehensive multi-channel, multi-speaker, multi-scene dataset."
        - "Determined in-vehicle microphone array schemes. Using neural network-based beamforming estimation to construct a multi-directional speaker extraction system that effectively eliminated noise and interfering voices, as validated by subjective testing."

